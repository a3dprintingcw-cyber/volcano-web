<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sushi Menu TV | Volcano Experience</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="/img/icon-180.png">
  <link rel="stylesheet" href="/sushi/tv/tv.css">
  <script src="/sushi/tv/tv.js" defer></script>
</head>
<body>
  <!--
    Menu board for TVs. Open in the TV's browser (or a Fire TV Stick / Chromecast) and go full screen.
      /sushi/tv/                    landscape TV: three menu pages side by side, changing every 20 seconds
      /sushi/tv/?screen=portrait    vertical TV: the whole menu on one picture (add &cycle=1 for one page at a time)
      add &rotate=90 or &rotate=270 when a vertical TV still shows the picture sideways
      add &seconds=15 to change how long each screen stays up
  -->
  <div id="board" class="board"></div>
</body>
</html>
